<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Criar post</title>
    <link rel="stylesheet" href="/labs.css">
</head>
<body>

    <form action="/cadastrar_post" method="post">
        <p>Título:</p>
        <input type="text" name="titulo" required>

        <p>Resumo:</p>
        <input type="text" name="resumo" required>

        <p>Conteúdo:</p>
        <input type="text" name="conteudo" required>

        <button>Enviar</button>
    </form>

    <a href="/blog">Voltar</a>
</body>
</html>
