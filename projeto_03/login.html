<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body {
            background-color: #e8f0fe;
            text-align: center;
            font-family: Arial;
            margin-top: 80px;
        }
        input {
            margin: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Login</h1>

    <form action="/login" method="POST">
        <input type="email" name="email" placeholder="Email" required>
        <br>
        <input type="password" name="senha" placeholder="Senha" required>
        <br>
        <button type="submit">Entrar</button>
    </form>

    <p><a href="/cadastra">Criar uma conta</a></p>
</body>
</html>
